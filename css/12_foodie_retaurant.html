<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FODDIE RESTAURANT</title>
    <style>
        body
        {
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background-color: #fff8f0;
        }
        header
        {
            background-color:#e63946;
            color: white;
            padding: 25px;
            text-align:center;
        }
        nav{
            background-color:#333;
            padding:15px;
            text-align:center;
        }
        nav a{
            color:white;
            text-decoration:none;
            margin:20px;
        }
        .container
        {
            display: flex;
            justify-content: center;
            gap:25px;
            padding:30px;
        }
        .food
        {
            background-color:white;
            width:250px;
            padding:20px;
            text-align:center;
            border-radius:15px;
            box-shadow:0 4pc 10px #ccc;
        }
        .food img{
            width:100%;
            height:150px;
            object-fit:cover;
            border-radius:10px;
        }
        button{
            background-color:black;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            transition:0.3s;
        }
        button:hover{
            /*transform:translateY(-5px);*/
            transform:scale(1.2);
            background-color:green;
            box-shadow:0 5px 10px gray;
        }
    </style>
</head>
<body>
    <header>
        <h1>
            FOODIE RESTAURANT
        </h1>
        <p>Delicious food,happy life!</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="food">
            <img src="https://picsum.photos/500?random1" alt="">
            <h2>pizza</h2>
            <p>cheesy and delicious</p>
            <button>order now</button>
        </div>
        <div class="food">
            <img src="https://picsum.photos/500?random2" alt="">
            <h2>burger</h2>
           <p>fresh and testy burger</p>
            <button>order now</button>
        </div>
        <div class="food">
            <img src="https://picsum.photos/500?random3" alt="">
            <h2>grilled food</h2>
            <p>enjoy our special dishes</p>
            <button>order now</button>
        </div>
    </div>
</body>
</html>
