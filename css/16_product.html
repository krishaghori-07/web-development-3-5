<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header>
        <h1>STYLE <span>STORE</span></h1>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <section class="hero">
        <h2>upgrade your style</h2>
        <p>Discover Products you'll love.</p>
        <a href="#products" class="shop-btn">Shop Now</a>
    </section>


    <section class="products" id="products">
        <h2>our products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/600?random=1" alt="wireless headphones">
                </div>
                <div class="product-info">
                    <span class="category">Electronics</span>
                    <h3>wireless headphones</h3>
                    <p class="price">
                        $2,499
                    </p>
                    <button>Buy Now</button>
                </div>   
            </div>
            <div classs="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/600?random=3" alt="red sports">
                </div>
                <div class="product-info">
                    <span class="category">Fashion</span>
                    <h3>Sports Sneakers</h3>
                    <p class="price">$3,999</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/600?random=1" alt="classsic wristwatch">
                </div>
                <div class="product-info">
                    <span class="category">Accessories</span>
                    <h3>classic wristwatch</h3>
                    <p class="price">
                        $1,999
                    </p>
                    <button>Buy now</button>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <p>&#xa9; 2026 stylestore|shop with style</p>
    </footer>
</body>
</html>
