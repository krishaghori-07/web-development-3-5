<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css pseudo class example</title>
    <style>
        a:link{
            color:blue;
        }
        a:visited{
            color:purple;
        }
        a:hover{
            color:red;
            background-color:yellow;
        }
        a:active{
            color:green;
            background-color:burlywood;
        }
    </style>
</head>
<body>
    <h2>css pseudo classes</h2>
    <a href="https://chatgpt.com/">visit chatgpt</a>
</body>
</html>
