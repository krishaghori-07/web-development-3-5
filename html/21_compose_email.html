<html>
    <head>
        <title>email compose</title>
    </head>
    <body>
        <form action="success.html">
            <table align="center" width="50%" border="1" cellpadding="10" >
                <tr>
                    <th bgcolor="yellow">compose email</th>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">email</td>
                </tr>
                <tr>
                    <td>
                        <input type="email" name="email" id="email">
                    </td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">
                        subject
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="subject" id="subject">
                    </td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">
                        Attachment
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="file" name="attachment" id="attachment">
                    </td>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">
                        Address
                    </td>
                </tr>
                <tr>
                    <td>
                        <textarea name="address" rows="5" cols="30" id="address"></textarea>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <button type="submit">send email</button>
                        <button type="reset">clear all</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
