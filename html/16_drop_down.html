<html>
    <head>
        <title>
            drop down list
        </title>
    </head>
    <body>
        <h1>select your course</h1>
        <form>
            Course:
            <select name="course">
                <option value="html">html</option>
                <option value="css">css</option>
                <option value="bootstrap">bootstrap</option>
                <option value="javascript">javascript</option>
                <option value="php">php</option>
            </select>
        </form>
    </body>
</html>
