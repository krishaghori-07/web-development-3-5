<html>
    <head>
        <title>online examination</title>
    </head>
    <body>
        <h1 align="center">online examination system</h1>
        <form>
        <label>Name:</label>
        <input type="text" required/>
        <br><br>
        <label>roll no:</label>
        <input type="number" required/>
        <br><br>
        <label>Email:</label>
        <input type="email" required/>
        <br><br>
        <h2>question-1</h2>
        <p>which language is used to create the structure of web page</p>
        <input type="radio" name="q1">html
        <br>
        <input type="radio" name="q1">css
        <br>
        <input type="radio" name="q1">python
        <br>
        <input type="radio" name="q1">php
        <br><br>
        <h2>question-2</h2>
        <p>which tags are used to create a table</p>
        <input type="radio" name="q2">table
        <br>
        <input type="radio" name="q2">tr
        <br>
        <input type="radio" name="q2">td
        <br>
        <input type="radio" name="q2">img
        <br><br>
        <h2>question-3</h2>
        <p>choose your experiance level</p>
        <select>
            <option>begginer</option>
            <option>intermediate</option>
            <option>Advanced</option>
        </select>
        <br><br>
        <h2>question-4</h2>
        <p>write your answer:</p>
        <textarea cols="60" rows="7"></textarea>
        <br><br>
        <input type="submit" value="submit exam">
        <input type="reset" value="reset">
    </form>
    </body>
</html>
