<html>
    <head>
        <title>simple form</title>
    </head>
    <body>
        <h1>contact form</h1>
        <form action="">
            Name: <input type="text" name="name" id="name">
            <br>
            <br>
            Email: <input type="text" name="email" id="email">
            <br>
            <br>
            Message: <textarea name="Message" id="Message" rows="5" cols="30"></textarea>
            <br>
            <br>
            <input type="submit" value="submit">
        </form>
    </body>
</html>
