<html>
    <head>
        <title>
            bus route form
        </title>
    </head>
    <body>
        <form action="success.html">
           <table border="1" cellpadding="10" width="100%" cellspacing="5">
             <tr>
                <td>
                    <label for="source">source</label>
                    <br>
                    <input type="text" name="source" id="source">
                </td>
                <td>
                    <label for="destination">Destination</label>
                    <br>
                    <input type="text" name="destination" id="destination">
                </td>
                <td>
                    <label for="journeydate">Date</label>
                    <br>
                    <input type="date" name="journeydate" id="journeydate">
                </td>
                <td>
                    <label for="">seats</label>
                    <br>
                    <select name="seat" id="seat">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </td>
                <td>
                    <label for="">bus type</label>
                    <br>
                    <label for="express">
                        <input type="checkbox" name="express" id="express">Express
                    </label>
                    <br>
                    <label for="ac">
                        <input type="checkbox" name="ac" id="ac">AC
                    </label>
                    <br>
                    <label for="volvo">
                        <input type="checkbox" name="volvo" id="volvo"> Volvo
                    </label>
                    <br>
                    <label for="sleeper">
                        <input type="checkbox" name="sleeper" id="sleeper">sleeper
                    </label>
                </td>
                <td>
                    <label for="">select gender</label>
                    <br>
                    <label for="male">
                        <input type="radio" name="male" id="male">Male
                    </label>
                    <br>
                    <label for="female">
                        <input type="radio" name="female" id="female">Female
                    </label>
                </td>
                <td>
                        <input type="submit" value="search">
                </td>
            </tr>
           </table>
        </form>
    </body>
</html>
