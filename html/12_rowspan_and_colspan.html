<html>
    <head>
        <title>table rowspan and colspan</title>
    </head>
    <body>
        <h1>student result</h1>
        <table border="1" cellpadding="10">
            <tr>
                <th colspan="3">student details</th>
            </tr>
            <tr>
                <th>name</th>
                <th>subjects</th>
                <th>marks</th>
            </tr>
            <tr>
                <td rowspan="2">abc</td>
                <td>html</td>
                <td>85</td>
            </tr>
            <tr>
                <td>css</td>
                <td>90</td>
            </tr>
        </table>
    </body>
</html>
