<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minimum & maximum</title>
</head>
<body>
    <form action="">
        <table border="1" cellpadding="10" width="100%" bgcolor="#eeeee">
            <tr>
                <td>
                    <label for="source">Source</label>
                    <input type="text" name="source" id="source">
                </td>
                <td>
                    <label for="destination">Destination</label>
                    <input type="text" name="destination" id="destination">
                </td>
                <td>
                    <label for="journeydate">date</label>
                    <input type="date" name="journeydate" id="journeydate"
                    min="2026-09-26" max="2026-10-17" required>
                </td>
                <td>
                    <label for="seats">seats</label>
                    <input type="number" name="seats" id="seats" min="1" max="6">
                </td>
                <td>
                    <label for="">bus type</label>
                    <br>
                    <label for="express">
                        <input type="checkbox" id="express" name="express">Express
                    </label>
                    <br>
                    <label for="ac">
                        <input type="checkbox" id="ac" name="ac">AC
                    </label>
                    <br>
                    <label for="volvo">
                        <input type="checkbox" id="volvo" name="volvo">Volvo
                    </label>
                    <br>
                    <label for="sleeper">
                        <input type="checkbox" id="sleeper" name="sleeper">Sleeper
                    </label>
                </td>
                <td>
                    <label for="">select gender</label>
                    <label for="male">
                        <input type="radio" name="gender" id="male">male
                    </label>
                    <br>
                    <label for="female">
                        <input type="radio" name="gender" id="female">female
                    </label>
                </td>
                <td>
                    <input type="submit" value="search">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
