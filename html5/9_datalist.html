<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datalist</title>
</head>
<body>
    <h2>select your country</h2>
    <input list="countries" placeholder="enter your country">
    <datalist id="countries">
        <option value="india">
        <option value="usa">
        <option value="london">
        <option value="canada">
        <option value="uk">
    </datalist>
</body>
</html>
