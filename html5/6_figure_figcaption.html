<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure and fig caption tag</title>
</head>
<body>
    <h1>
        example of figure and figcaption tag
    </h1>
    <figure>
        <img src="images/1.png" width="80%" alt="">
        <figcaption>
            india's official map accepted by united nations
        </figcaption>
    </figure>
</body>
</html>
